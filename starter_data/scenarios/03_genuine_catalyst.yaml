rules:
- name: takes_the_trade
  description: With news + reasoning + algorithm aligned, the agent must open a position.
  require:
  - \"?traded\"?\s*:\s*true
  severity: error
- name: meaningful_conviction
  description: Two-plus affirmative witnesses should clear 0.4 conviction, not a token lean.
  require:
  - final_conviction\"?\s*:\s*0*\.([4-9]|\d*[5-9])|final_conviction\"?\s*:\s*1(\.0)?
  severity: error
- name: names_the_catalyst
  description: The mechanism must reference the specific dated fact, not generic sentiment.
  require:
  - (guidance|NVDA|NVIDIA|datacenter|capex|unrevised|not been revised)
  severity: error
- name: stop_at_least_1_5_atr
  description: ATR 8.86 -> stop must be at least $13.29 from entry.
  require:
  - "(1\\.5\\s*(x|\xD7)\\s*ATR|1\\.5\\s*ATR|ATR\\s*(x|\xD7)\\s*1\\.5)"
  severity: error
- name: logs_attribution
  description: Attribution must be logged every cycle.
  require:
  - log_signal_attribution
  severity: error
