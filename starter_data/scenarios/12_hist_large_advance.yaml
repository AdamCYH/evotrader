  BEARISH_VEHICLE: 'buy PSQ (-1x inverse QQQ ETF; bearish vehicle ONLY, never its own thesis)
    — it rises when QQQ falls. A PSQ buy is `direction: LONG`: the bearish thesis lives in
    the ticker, not the direction. No margin and no expiry.'
  DIRECTIONS_AVAILABLE: |-
    **LONG ONLY.** Short-selling shares of QQQ requires a margin account, and this is a cash account — so it is unavailable regardless of what the symbol permits. It is also disabled in the constitution (`allow_short_sell`/`allow_margin`).
      - `side: 'buy'` opens or adds to a long.
      - `side: 'sell'` CLOSES a long you already hold. It does NOT open a short. If a long is open, sending `sell` for a bearish thesis will LIQUIDATE that long — an unintended exit, not a short.
      - Never propose or place `direction: SHORT` on QQQ.
    To act on a bearish view, buy PSQ (-1x inverse QQQ ETF; bearish vehicle ONLY, never its own thesis) — it rises when QQQ falls. A PSQ buy is `direction: LONG`: the bearish thesis lives in the ticker, not the direction. No margin and no expiry.
    This is the limited-risk route: the most a bought put can lose is the premium paid, whereas short-selling shares can lose without limit.
  SCHEDULE: Every hour during regular market hours on weekdays; ad-hoc via UI outside market
    hours
