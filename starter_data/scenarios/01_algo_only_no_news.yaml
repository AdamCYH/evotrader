rules:
- name: no_trade_on_algorithm_alone
  description: "Algorithm is the only affirmative witness (news muted, reasoning fails the priced-in test).\
    \ The agreement gate caps conviction at 0.0 \u2014 must be flat."
  forbid:
  # The quantity must be NON-ZERO. The bare \d+ form matched the phrase
  # No open positions ... = 0 shares in a correctly-flat response, failing
  # an agent that complied perfectly. A test that cries wolf gets ignored.
  - \b(BUY|LONG|OPEN)\b[^.\n]{0,80}\b(?!0+(\.0+)?\s*shares)\d+(\.\d+)?\s*shares
  - final_conviction\"?\s*:\s*0*\.[1-9]
  - \"traded\"\s*:\s*true
  severity: error
- name: acknowledges_missing_news
  description: Must note that the news witness is silent, not treat it as agreement.
  require:
  - news[^.\n]{0,80}(empty|silent|no items|absent|unavailable|not available|no news)
  severity: error
- name: logs_attribution
  description: Attribution must be logged every cycle, traded or not.
  require:
  - log_signal_attribution
  severity: error
