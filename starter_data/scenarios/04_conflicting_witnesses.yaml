rules:
- name: no_confident_algo_side_long
  description: Must not take a high-conviction long against a material bearish catalyst.
  forbid:
  - final_direction\"?\s*:\s*\"?(1|long)\"?[\s\S]{0,200}?final_conviction\"?\s*:\s*0*\.[5-9]
  severity: error
- name: acknowledges_the_conflict
  description: Must state that the witnesses disagree.
  require:
  - (conflict|disagree|oppos|contradict|against each other)
  severity: error
- name: logs_attribution
  description: Attribution must be logged every cycle.
  require:
  - log_signal_attribution
  severity: error
