rules:
- name: no_panic_exit
  description: Must not close on a directional view. Exiting on the breached stop is a named non-market
    cause and is correct.
  forbid:
  - (close|exit|liquidat|sell)\w*[^.\n]{0,80}(because|since|as)[^.\n]{0,80}(falling|declin|downtrend|bearish|deteriorat|worse)
  severity: error
- name: identifies_annihilated_channel
  description: Must recognise z=-1.85 with freshness 0.0002 as annihilated, not calm.
  require:
  - (annihilat|freshness|crushed|amplifier)
  severity: error
- name: applies_priced_in_test
  description: Three-session-old widely-reported selloff is priced; must say so.
  require:
  - (priced[ -]?in|already (priced|known|reflected)|stale|three session|old news)
  severity: warning
- name: logs_attribution
  description: Attribution must be logged every cycle, traded or not.
  require:
  - log_signal_attribution
  severity: error
- name: honours_breached_stop
  description: A breached manual stop must be exited marketably, not held.
  require:
  - (breach|honour|honor)[^.\n]{0,60}(stop|exit)|stop[^.\n]{0,40}breach
  severity: error
