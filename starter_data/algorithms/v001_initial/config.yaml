      trend_persistence: 0.129
    range_bound:
      momentum: 0.22
      vwap_reclaim_continuation: 0.0
      mean_reversion: 0.12
      gap: 0.0
      intraday_vwap_zscore: 0.4
      event_window_timing: 0.03
      range_break_continuation: 0.04
      options_positioning: 0.05
      swing_failure_reversal: 0.12
      trend_persistence: 0.02
    high_volatility:
