# Parameters of the composite algorithm: one block per sub-strategy, then the
# `composite` block that weights them, per market regime. These are starting
# values, not a proven edge. The evolution agent proposes changes as new
# versions; you approve them in the console.

# Thresholds on the SIZE of a price move are in daily ATRs (average true range:
# the typical size of one day's move), so they mean the same thing whichever
# ticker you trade. The *_pct values beside them are fallbacks used only when
# ATR is missing. The ATR values were set to match the old percent values on
# SPY, the starter ticker (daily ATR ≈ 1.05% of price over 2024-2026): on SPY
# the two behave the same; on a more volatile stock only the ATR form scales.

momentum:
  ema_short: 9
  ema_long: 21
  sma_short: 20
  sma_long: 50
  volume_confirmation: true
  volume_dampener_floor: 0.7
  intraday_divergence_decay: 0.5
  # Today's move against the daily trend, in daily ATRs: 0.5 is half an
  # ordinary day on any instrument. The percent is used only when a snapshot
  # has no ATR.
  divergence_day_change_atr: 0.5   # 0.5 daily ATR
  divergence_day_change_pct: 0.6   # 0.6% — fallback only
  # The same guard over several sessions: also decay the vote when the move
  # from the close N sessions ago runs against it by at least this many ATRs.
  # Catches a decline made of small days. Off here (1 session, no threshold).
  divergence_window_days: 1
  divergence_cum_atr: null
  rvol_source: session   # today's volume vs the same minute of the last 20 sessions; the daily ratio (labelled *_fallback) until 10:30 ET
mean_reversion:
  rsi_period: 14
  rsi_oversold: 28
  rsi_overbought: 72
  bollinger_period: 20
  bollinger_std: 2.0
  ibs_oversold: 0.2
  ibs_overbought: 0.8
  rsi_weight: 0.6
  bollinger_weight: 0.2
  ibs_weight: 0.2
  trend_fade_decay: 0.2
gap:
  min_gap_atr: 0.3               # gap of 0.3 daily ATR; the same scale on any ticker
  gap_fade_threshold_atr: 0.95   # 0.95 daily ATR
  min_gap_pct: 0.3               # 0.3% — fallback only, when ATR is missing
  gap_fade_threshold: 1.0        # 1.0% — fallback only
  decay_minutes: 120
intraday_vwap_zscore:
  zscore_window: 20
  entry_z: 1.1
  countertrend_dampener: 0.5
  with_trend_trigger_scale: 0.7
  z_scale: 0.5
  staleness_decay: 0.92
  min_std: 0.15
  max_rvol_for_fade: 1.5
  high_vol_dampener: 0.4
  rvol_source: session   # today's volume vs the same minute of the last 20 sessions; the daily ratio (labelled *_fallback) until 10:30 ET
event_window_timing:
  blackout_hours: 30
  post_event_hours: 48
  min_iv_crush: 0.1
  min_overextension_atr: 1.45    # 1.45 daily ATRs from VWAP
  min_overextension: 0.015       # 1.5% of VWAP (a fraction) — fallback only
  pre_event_dampener: 0.05
  post_event_boost: 1.5
range_break_continuation:
  min_break_atr: 0.65            # the day's move of 0.65 daily ATR confirms a break
  min_break_pct: 0.7             # 0.7% — fallback only
  macd_confirm_floor: 0.0
  base_strength: 0.45
  penetration_scale: 0.35
  vwap_confirm: true
  ibs_confirm: 0.7
options_positioning:
  pcr_baseline: 1.0
  pcr_std: 0.5
  extreme_z: 2.0
  contrarian_scale: 0.3
  confirm_scale: 0.15
  event_window_hours: 36
  post_event_hours: 48
  unwind_threshold: 0.5
  post_event_kicker: 0.3
swing_failure_reversal:
  lookback_bars: 20   # intraday bars; a longer window leaves early-session cycles without enough bars
  min_confirm_bars: 2
  max_confirm_bars: 14
  min_stretch_atr: 0.3
  stretch_scale: 0.3
  confirm_decay: 0.87
  reclaim_scale: 0.5
  base_strength: 0.8
  require_current_session_anchor: true
trend_persistence:
  lookback_days: 7
  min_persistence_frac: 0.6
  min_cum_atr: 1.5
  min_efficiency: 0.35
  cum_scale: 2.0
  base_strength: 0.75
  exhaustion_atr: 5.0
  exhaustion_decay: 0.5
  counter_day_atr: 0.95          # a 0.95-ATR day against the trend halves the signal
  counter_day_pct: 1.0           # 1.0% — fallback only
  counter_day_decay: 0.5
  # The moving-average stack as a size modifier instead of a veto: with both
  # set, a grind against the stack still votes, scaled down. null = the stack
  # must agree, as before.
  counter_stack_scale: null
  no_stack_scale: null
vwap_reclaim_continuation:
  lookback_bars: 30
  min_dip_bars: 2
  min_dip_atr: 0.1
  max_dip_atr: 0.9
  max_minutes_since_reclaim: 90.0
  dip_scale: 0.35
  reclaim_decay: 0.8
  base_strength: 0.75
  min_rvol: 0.5
  rvol_scale: 1.0
  require_current_session_anchor: true
  rvol_source: session   # today's volume vs the same minute of the last 20 sessions; the daily ratio (labelled *_fallback) until 10:30 ET
gap_fail_continuation:
  min_gap_pct: 1.5          # used only when no daily ATR can be measured
  min_gap_atr: 0.3          # the gap must be at least this many daily ATRs
  min_penetration_atr: 0.05 # price through the prior close, against the gap
  min_vwap_dev_atr: 0.1     # and past session VWAP, against the gap
  hold_bars: 3              # the last three 5-minute closes all through the prior close
  base_strength: 0.6
  gap_scale_atr: 0.5
  penetration_scale_atr: 0.5
  min_minutes_since_open: 60.0   # the first hour belongs to the gap channel's fill read
  late_session_minute: 360.0     # fade to 0 from 15:30 ET ...
  session_minutes: 390.0         # ... to the 16:00 ET close
vwap_reclaim_fade:
  lookback_bars: 30
  min_dip_bars: 2
  min_dip_atr: 0.1
  max_dip_atr: 0.9
  max_minutes_since_reclaim: 90.0
  dip_scale: 0.35
  reclaim_decay: 0.8
  base_strength: 0.6
  max_rvol_for_fade: 1.0    # a reclaim at or above normal volume: abstain
  full_fade_rvol: 0.6       # full strength at or below this relative volume
  require_current_session_anchor: true
  rvol_source: session
composite:
  momentum_weight: 0.2
  mean_reversion_weight: 0.18
  gap_weight: 0.0
  intraday_vwap_zscore_weight: 0.14
  event_window_timing_weight: 0.06
  range_break_continuation_weight: 0.13
  options_positioning_weight: 0.1
  swing_failure_reversal_weight: 0.12
  trend_persistence_weight: 0.0
  gap_fail_continuation_weight: 0.0
  vwap_reclaim_fade_weight: 0.0
  regime_adaptive: true
  renormalize_on_abstain: true
  # With regime_adaptive on, these weights replace the flat ones above for the
  # regime detected this cycle. vwap_reclaim_continuation,
  # gap_fail_continuation and vwap_reclaim_fade are weighted 0 in every
  # regime: they run and are recorded, but do not vote until promoted.
  regime_weights:
    trending_bull:
      momentum: 0.2045
      vwap_reclaim_continuation: 0.0
      gap_fail_continuation: 0.0
      vwap_reclaim_fade: 0.0
