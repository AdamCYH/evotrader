[project]
name = "evotrader"
version = "0.2.0"
description = "A self-evolving AI agent that trades: a multi-agent trading system with hard risk limits and a weekly self-improvement loop"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Adam Chiu", email = "adamc@immersialabs.com" }]
keywords = [
    "trading",
    "algorithmic-trading",
    "ai-agents",
    "multi-agent",
    "llm",
    "self-improving",
    "google-adk",
    "mcp",
    "robinhood",
    "paper-trading",
]
# No "License ::" classifier: `license` above is an SPDX expression, which
# replaces those classifiers (PEP 639); some build tools reject having both.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Agent framework
    "google-adk",
    "litellm",
    # Data models & validation
    "pydantic>=2.0",
    # Data processing & technical analysis
    "pandas>=2.0",
    "numpy>=1.26",
    "ta>=0.11",          # Technical analysis library (pure Python, no C deps)
    # Database
    "aiosqlite>=0.20",
    # Vector store for semantic memory
    "chromadb>=0.5",
    # Configuration
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Dashboard
    "rich>=13.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "stock-analysis",
]

[project.optional-dependencies]
# Optional: run the evolution cycle through the Claude Code CLI so it bills
# against a Claude subscription instead of per-token API usage.
# Also requires the `claude` CLI itself: npm install -g @anthropic-ai/claude-code
# See docs/claude_code_evolution.md
claude-code = [
    "claude-agent-sdk>=0.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "pandas-stubs",
    "types-PyYAML",
    "types-aiofiles",
]

[project.scripts]
evotrader = "evotrader.main:run"

[project.urls]
Homepage = "https://github.com/AdamCYH/evotrader"
Repository = "https://github.com/AdamCYH/evotrader"
Issues = "https://github.com/AdamCYH/evotrader/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evotrader"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    # Not "TC"/"TCH" (type-checking-only imports): the Pydantic models read
    # their annotations at runtime, so moving imports under TYPE_CHECKING
    # breaks them.
]
ignore = [
    "E501",    # line length is the formatter's job; what remains is strings, URLs, comments
    "UP042",   # (str, Enum) -> StrEnum changes str() of members, which logs and f-strings print
    "RUF001",  # the plain-language text uses typographic characters (× − – ’) on purpose
    "RUF002",
    "RUF003",
    "N806",    # UPPER_CASE constants defined inside functions are deliberate
    "SIM102",  # nested ifs, ternaries, try/except-pass and dict lookups are kept
    "SIM105",  # where they read more clearly; style, not defects
    "SIM108",
    "SIM116",
    "RUF005",  # [*a, b] versus a + [b]: style
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "B017",    # pytest.raises(Exception) is fine for "does not crash quietly" tests
    "RUF012",  # test doubles and fixture tables live as class attributes
]
"src/evotrader/db/thought_log.py" = ["SIM118"]  # rows may be sqlite3.Row, where `in` tests values
"src/evotrader/backtest/runner.py" = ["W291"]  # trailing double spaces are Markdown line breaks

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
# Pinned to a commit so every install gets the same code (MIT-licensed).
stock-analysis = { git = "https://github.com/nickzren/stock-analysis-mcp", rev = "c4c51b3d813b29ae02698b9704de40dddaa60616" }
